name: Build CI Environment

on:
  push:
    branches:
      - devel
      - main
    paths:
      - .github/**
      - tools/ansible/**
      - build/**
  workflow_dispatch:

jobs:
  build-ci-env:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Install ORAS
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt update && sudo apt install -y --no-install-recommends oras

      - name: Configure apt to retain downloaded .deb packages
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo rm -rf /var/cache/apt/archives/*.deb

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Prepare to Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -uxo pipefail
          sudo rm -rf /usr/local/bin/* /usr/local/lib/node_modules /usr/local/rubies
          sudo apt install -y --no-install-recommends pipx
          pipx ensurepath
          pipx uninstall ansible-core
          "$GITHUB_WORKSPACE/tools/ansible/install-ansible.sh"

      - name: Run install-dev-tools Playbook
        run: |
          set -uxo pipefail
          ansible-playbook -i "$GITHUB_WORKSPACE/.github/ansible/inventories/ci-runner-inv.yml" "$GITHUB_WORKSPACE/tools/ansible/install-dev-tools.yml"

      - name: Archive Compiled Software in /opt and APT Cache
        working-directory: ${{ runner.temp }}
        run: |
          set -x
          sudo mkdir -p /opt/ci-apt-cache
          sudo mv /var/cache/apt/archives/*.deb /opt/ci-apt-cache/
          tar --zstd -cf ci-env.tar.zst /opt/ci-apt-cache /opt/arvados-ansible /opt/arvados-bundler /opt/go-* /opt/node-* /opt/Python-* /opt/ruby-* /opt/singularity-*
          ls -l ci-env.tar.zst

      - name: Push Archive to GHCR Using ORAS
        working-directory: ${{ runner.temp }}
        run: |
          set -uo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          PKG_NAME="$(echo "${{ github.event.repository.name }}-ci-env" | tr '[:upper:]' '[:lower:]')"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

          oras push "ghcr.io/${OWNER}/${PKG_NAME}:ubuntu-24.04" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=Pre-built Arvados-CE CI environment for Ubuntu 24.04" \
            ci-env.tar.zst:application/zstd

      - name: Clean Up Older CI Env Package Versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ env.PKG_NAME }}
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 1
