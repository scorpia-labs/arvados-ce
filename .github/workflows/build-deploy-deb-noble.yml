name: Build and Deploy Debian Package APT Repo

on:
  push:
    branches:
      - main
      - github-actions-*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Build Environment
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y --no-install-recommends pipx apt-utils gnupg gzip
          pipx ensurepath
          pipx uninstall ansible-core
          "$GITHUB_WORKSPACE/tools/ansible/install-ansible.sh"

      - name: Build Debian Packages
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          cd "$WORKSPACE/build" && ./run-build-packages-one-target.sh --target ubuntu2404 --force-build

      - name: Generate Signed APT Repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: .github/scripts/make-apt-repo.sh ./packages/ubuntu2404 ./apt-repo

      - name: Generate Directory Indices for Pages
        uses: yKicchan/generate-directory-listing-action@v1
        with:
          target: ./apt-repo

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apt-repo

  deploy:
    needs:
      - build
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
