name: Run Tests for Pull Request

on:
  pull_request:
    branches-ignore:
      - build-packages-*
  push:
    branches:
      - github-actions-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-tests:
    name: "CI Test: ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    environment:
      name: >-
        ${{
          (
            github.event.pull_request.head.repo.fork
            && !contains(fromJSON(vars.TRUSTED_ACTORS || '[]'), github.actor)
          )
          && 'external-pr-approval'
          || ''
        }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Crunchrun"
            args: ["--only", "lib/crunchrun"]
            allow_failure: true

          - name: "Workbench e2e"
            args: ["--only", "services/workbench2_integration"]
            allow_failure: true

          - name: "Arvados FUSE"
            args: ["--only", "services/fuse"]
            allow_failure: false

          - name: "Main test suite"
            args:
              - "--skip"
              - "lib/crunchrun"
              - "--skip"
              - "services/workbench2_integration"
              - "--skip"
              - "services/fuse"
            allow_failure: false
    steps:
      - name: Install ORAS
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt update && sudo apt install -y --no-install-recommends oras

      - name: Pull and Extract Pre-Built /opt Environment and Ansible Dir
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_ARTIFACT: ${{ vars.CI_ENV_ARTIFACT }}
        run: |
          set -uxo pipefail
          if [ -n "$CUSTOM_ARTIFACT" ]; then
            ARTIFACT="$CUSTOM_ARTIFACT"
          else
            TARGET_REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            ARTIFACT="ghcr.io/${TARGET_REPO}-ci-env:ubuntu-24.04"
          fi
          oras pull "$ARTIFACT"
          sudo tar --zstd -xf ci-env.tar.zst -C /
          tar --zstd -xf dot-ansible.tar.zst -C "$HOME"
          rm -f ci-env.tar.zst dot-ansible.tar.zst

      - name: Apply .deb Cache
        run: |
          if compgen -G "/opt/ci-apt-cache/*.deb" > /dev/null; then
            sudo mkdir -p /var/cache/apt/archives
            sudo mv /opt/ci-apt-cache/*.deb /var/cache/apt/archives/
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run install-dev-tools Playbook
        run: |
          set -uxo pipefail
          sudo rm -rf /usr/local/bin/* /usr/local/lib/node_modules /usr/local/rubies
          . /opt/arvados-ansible/bin/activate
          ansible-playbook -i "$GITHUB_WORKSPACE/.github/ansible/inventories/ci-runner-inv.yml" "$GITHUB_WORKSPACE/tools/ansible/install-dev-tools.yml"

      - name: Run Test Script
        id: run_test
        continue-on-error: ${{ matrix.allow_failure }}
        env:
          ARGS_JSON: ${{ toJSON(matrix.args) }}
        run: |
          set -uxo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.daemon=false" >> "$HOME/.gradle/gradle.properties"
          . /etc/profile.d/arvados-test.sh
          export ARVADOS_TEST_TEMP="$HOME/.config/arvados-test"
          mkdir -p "$ARVADOS_TEST_TEMP"
          readarray -d '' RUN_TESTS_ARGS < <(jq --raw-output0 '.[]' <<< "$ARGS_JSON")
          newgrp docker
          "$GITHUB_WORKSPACE/build/run-tests.sh" --temp "$ARVADOS_TEST_TEMP" "${RUN_TESTS_ARGS[@]}"
