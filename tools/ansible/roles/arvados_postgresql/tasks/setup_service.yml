- name: Install psycopg2
  become: yes
  ansible.builtin.apt:
    name:
      - python3-psycopg2

- name: Ensure main PostgreSQL service is enabled and started
  become: yes
  ansible.builtin.service:
    name: postgresql
    enabled: yes
    state: started

- name: Find pg_hba.conf file on Debian/Ubuntu
  when: arvados_postgresql_hba_file is falsy
  become: yes
  ansible.builtin.find:
    paths: /etc/postgresql
    patterns: pg_hba.conf
    recurse: yes
    file_type: file
  register: pg_hba_find

- name: Find pg_hba.conf file via database query
  when: arvados_postgresql_hba_file is falsy and (pg_hba_find.matched|default(0) == 0)
  become: yes
  become_user: postgres
  community.postgresql.postgresql_query:
    login_db: postgres
    query: SHOW hba_file;
  register: pg_hba_query

- name: Set pg_hba_path fact
  ansible.builtin.set_fact:
    pg_hba_path: "{{ arvados_postgresql_hba_file or ( (pg_hba_find.files | sort(attribute='path') | last).path if pg_hba_find.matched|default(0) > 0 else pg_hba_query.query_result.0.hba_file ) }}"

- name: Ensure PostgreSQL cluster service is enabled and started
  when: pg_hba_path.startswith('/etc/postgresql/')
  become: yes
  vars:
    cluster_name: "{{ pg_hba_path|dirname|relpath('/etc/postgresql')|replace('/', '-') }}"
  ansible.builtin.systemd_service:
    name: "postgresql@{{ cluster_name }}.service"
    enabled: yes
    state: started
    daemon_reload: yes

- name: Create pg_hba.conf entries
  when: arvados_postgresql_hba_databases is truthy and arvados_postgresql_hba_users is truthy
  become: true
  loop: "{{ arvados_postgresql_hba_sources }}"
  community.postgresql.postgresql_pg_hba:
    dest: "{{ pg_hba_path }}"
    contype: "{{ arvados_postgresql_hba_contype }}"
    databases: "{{ arvados_postgresql_hba_databases }}"
    method: "{{ arvados_postgresql_hba_method }}"
    users: "{{ arvados_postgresql_hba_users }}"
    source: "{{ item }}"
  register: pg_hba_entries

- name: Write PostgreSQL conf.d file
  when: arvados_postgresql_config is truthy
  become: true
  vars:
    conf_dir: "{{ pg_hba_path|dirname }}"
  ansible.builtin.template:
    src: arvados-ansible.conf.j2
    dest: "{{ arvados_postgresql_config_path or (conf_dir, 'conf.d', 'arvados-ansible.conf')|path_join }}"
    owner: root
    group: root
    mode: 0644
  register: arvados_postgresql_config_update

- name: Reload or restart PostgreSQL service
  become: yes
  vars:
    cluster_service_name: "{{ ('postgresql@' ~ pg_hba_path|dirname|relpath('/etc/postgresql')|replace('/', '-') ~ '.service') if pg_hba_path.startswith('/etc/postgresql/') else 'postgresql.service' }}"
  ansible.builtin.systemd_service:
    name: "{{ cluster_service_name }}"
    state: "{{ 'restarted' if arvados_postgresql_config_update.changed else 'reloaded' if pg_hba_entries.changed else 'started' }}"
    enabled: yes
    daemon_reload: yes
